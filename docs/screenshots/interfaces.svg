        <rect class="button" x="12" y="10" width="16" height="16"/>
        <text class="text" x="216" y="24">Enabled</text>
        <text class="text" x="294" y="24">admin-laptop</text>
        <text class="never" x="416" y="24">Never</text>
        <text class="text" x="576" y="24">2026-09-06</text>
        <text class="text" x="656" y="24">172.16.0.0/12</text>
        <text class="text" x="806" y="24">qP6hML0n...</text>
        <text class="text" x="936" y="24">10.22.0.6/32</text>
