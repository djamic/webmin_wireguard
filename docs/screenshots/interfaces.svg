<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">WireGuard VPN Webmin module interfaces screen</title>
  <desc id="desc">A sanitized screenshot-style preview of the WireGuard VPN module showing interface controls, peer status filtering, and a peer table.</desc>
  <defs>
    <style>
      .bg { fill: #f6f6f6; }
      .panel { fill: #fff; stroke: #d7d7d7; }
      .line { stroke: #d7d7d7; }
      .muted { fill: #666; }
      .text { fill: #111; font: 14px Arial, Helvetica, sans-serif; }
      .small { fill: #111; font: 12px Arial, Helvetica, sans-serif; }
      .title { fill: #111; font: 24px Arial, Helvetica, sans-serif; }
      .tab { fill: #fff; stroke: #d7d7d7; }
      .tab-inactive { fill: #fff; }
      .button { fill: #fff; stroke: #c9c9c9; }
      .link { fill: #0645ad; font: 14px Arial, Helvetica, sans-serif; }
      .head { fill: #fafafa; }
      .row { fill: #fff; }
      .row-alt { fill: #f3f3f3; }
      .online { fill: #087a2f; font: 14px Arial, Helvetica, sans-serif; }
      .idle { fill: #9a6200; font: 14px Arial, Helvetica, sans-serif; }
      .disabled { fill: #555; font: 14px Arial, Helvetica, sans-serif; }
      .never { fill: #111; font: 14px Arial, Helvetica, sans-serif; }
      .chip { fill: #eef6ff; stroke: #c8def7; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="760"/>
  <rect class="panel" x="24" y="22" width="1392" height="706"/>

  <text class="title" x="58" y="61">WireGuard VPN</text>
  <path d="M39 35l5.5 11.2 12.3 1.8-8.9 8.7 2.1 12.3L39 63.2 28 69l2.1-12.3-8.9-8.7 12.3-1.8z" fill="none" stroke="#c7c7c7" stroke-width="2"/>
  <rect class="button" x="1368" y="32" width="36" height="36"/>
  <text class="muted" x="1379" y="56" style="font: 18px Arial, Helvetica, sans-serif;">*</text>
  <line class="line" x1="24" y1="86" x2="1416" y2="86"/>

  <g transform="translate(36 112)">
    <rect class="button" x="0" y="0" width="190" height="34"/>
