      </g>

      <g transform="translate(0 156)">
        <rect class="row-alt" x="0" y="0" width="1368" height="38"/>
        <rect class="button" x="12" y="10" width="16" height="16"/>
        <text class="text" x="216" y="24">Disabled</text>
        <text class="text" x="294" y="24">guest</text>
        <text class="disabled" x="416" y="24">Disabled</text>
        <text class="text" x="576" y="24">Unlimited</text>
        <text class="text" x="656" y="24">0.0.0.0/0, ::/0</text>
        <text class="text" x="806" y="24">dJv92Psk...</text>
        <text class="text" x="936" y="24">10.22.0.5/32</text>
