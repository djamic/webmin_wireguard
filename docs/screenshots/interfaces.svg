    <rect class="tab" x="0" y="58" width="96" height="44"/>
    <text class="text" x="20" y="85">Interfaces</text>
    <text class="link" x="118" y="85">Generate peer</text>
    <line class="line" x1="0" y1="102" x2="1368" y2="102"/>

    <g transform="translate(0 122)">
      <rect class="button" x="0" y="0" width="190" height="34"/>
      <text class="link" x="14" y="22">WireGuard settings</text>
      <text class="text" x="218" y="22" style="font-weight: bold;">Show only</text>
      <rect class="button" x="298" y="3" width="116" height="28"/>
      <text class="text" x="310" y="22">All peers</text>
      <path d="M394 14l5 6 5-6z" fill="#222"/>
      <rect class="button" x="424" y="0" width="70" height="34"/>
      <text class="text" x="442" y="22">Apply</text>
